name: mty-prod

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: mty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MTY_INFRA_POSTGRES_DB:-mty_prod}
      POSTGRES_PASSWORD: ${MTY_INFRA_POSTGRES_PASSWORD:-mty_prod}
      POSTGRES_USER: ${MTY_INFRA_POSTGRES_USER:-mty_prod}
    ports:
      - "${MTY_INFRA_BIND_HOST:-127.0.0.1}:${MTY_INFRA_POSTGRES_PORT:-55432}:5432"
    volumes:
      - mty-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mty-prod-infra

  redis:
    image: redis:7
    container_name: mty-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_INFRA_REDIS_PORT:-56379}:6379"
    volumes:
      - mty-prod-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mty-prod-infra

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: mty-prod-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MTY_INFRA_MINIO_ROOT_USER:-mty_prod_minio}
      MINIO_ROOT_PASSWORD: ${MTY_INFRA_MINIO_ROOT_PASSWORD:-mty_prod_minio}
    command: server /data --console-address :9001
    ports:
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_INFRA_MINIO_PORT:-59000}:9000"
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_INFRA_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - mty-prod-minio-data:/data
    networks:
      - mty-prod-infra

  opensearch:
    build:
      context: ../..
      dockerfile: ops/opensearch/Dockerfile
    image: mty-opensearch:3.3.2-nori
    container_name: mty-prod-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_INFRA_OPENSEARCH_PORT:-59200}:9200"
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_INFRA_OPENSEARCH_PERF_PORT:-59600}:9600"
    volumes:
      - mty-prod-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - mty-prod-infra

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: mty-prod-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${MTY_INFRA_QDRANT_API_KEY:-mty_prod_qdrant}
    ports:
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_INFRA_QDRANT_PORT:-6333}:6333"
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_INFRA_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - mty-prod-qdrant-data:/qdrant/storage
    networks:
      - mty-prod-infra

  livekit:
    image: livekit/livekit-server:latest
    container_name: mty-prod-livekit
    profiles: ["video-chat"]
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: ${MTY_LIVEKIT_RTC_TCP_PORT:-7881}
          port_range_start: ${MTY_LIVEKIT_RTC_PORT_RANGE_START:-52000}
          port_range_end: ${MTY_LIVEKIT_RTC_PORT_RANGE_END:-52100}
          use_external_ip: true
        keys:
          ${MTY_LIVEKIT_API_KEY}: ${MTY_LIVEKIT_API_SECRET}
    ports:
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_LIVEKIT_PORT:-7880}:7880"
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_LIVEKIT_RTC_TCP_PORT:-7881}:${MTY_LIVEKIT_RTC_TCP_PORT:-7881}/tcp"
      - "${MTY_INFRA_BIND_HOST:-0.0.0.0}:${MTY_LIVEKIT_RTC_PORT_RANGE_START:-52000}-${MTY_LIVEKIT_RTC_PORT_RANGE_END:-52100}:${MTY_LIVEKIT_RTC_PORT_RANGE_START:-52000}-${MTY_LIVEKIT_RTC_PORT_RANGE_END:-52100}/udp"
    networks:
      - mty-prod-infra

  drawio:
    image: jgraph/drawio:${MTY_DRAWIO_IMAGE_TAG:-30.2.5}
    container_name: mty-prod-drawio
    restart: unless-stopped
    ports:
      - "${MTY_DRAWIO_BIND_HOST:-127.0.0.1}:${MTY_DRAWIO_PORT:-18083}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mty-prod-infra

  bento:
    build:
      context: ../..
      dockerfile: ops/bento/Dockerfile
    image: mty-bento:${MTY_BENTO_IMAGE_TAG:-1.0.17}
    container_name: mty-prod-bento
    restart: unless-stopped
    ports:
      - "${MTY_BENTO_BIND_HOST:-127.0.0.1}:${MTY_BENTO_PORT:-18084}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - mty-prod-infra

networks:
  mty-prod-infra:
    name: mty-prod-infra

volumes:
  mty-postgres-data:
    name: mty-postgres-data
  mty-prod-redis-data:
    name: mty-prod-redis-data
  mty-prod-minio-data:
    name: mty-prod-minio-data
  mty-prod-opensearch-data:
    name: mty-prod-opensearch-data
  mty-prod-qdrant-data:
    name: mty-prod-qdrant-data

[project]
name = "miy-official-worker"
version = "0.1.1"
description = "Inactive official MIY worker and Beat composition artifact."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["miy-worker==0.1.1"]

[build-system]
requires = ["hatchling>=1.32.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miy_official_worker"]

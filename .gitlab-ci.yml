workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_COMMIT_TAG =~ /^contracts-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
    - when: never

stages:
  - validate
  - review
  - publish

release_validation:
  stage: validate
  image: miy-validation:node22-python312
  services:
    - name: redis@sha256:5a77f0f4698389019f828f6387049ce1d5adbea204e56422aa7720dab7034287
      alias: redis
      command:
        - redis-server
        - --save
        - ''
        - --appendonly
        - 'no'
      variables:
        HEALTHCHECK_TCP_PORT: '6379'
    - name: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
      alias: minio
      command:
        - server
        - /data
        - --console-address=:9001
      variables:
        HEALTHCHECK_TCP_PORT: '9000'
        MINIO_ROOT_PASSWORD: miy_ci_minio_job_only
        MINIO_ROOT_USER: miy_ci_minio
    - name: miy-opensearch:3.3.2-nori
      alias: opensearch
      variables:
        HEALTHCHECK_TCP_PORT: '9200'
        discovery.type: single-node
        DISABLE_SECURITY_PLUGIN: 'true'
        OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
  tags:
    - miy-validation
  inherit:
    default: false
    variables:
      - MIY_CI_POSTGRES_DSN
  dependencies: []
  allow_failure: false
  interruptible: true
  resource_group: miy-release-validation
  environment:
    name: ci-validation
    action: access
  variables:
    GIT_DEPTH: '0'
    NODE_OPTIONS: '--max-old-space-size=3072'
    MIY_API_PYTEST_WORKERS: '2'
    VITEST_MAX_WORKERS: '1'
    PLAYWRIGHT_WORKERS: '1'
    MIY_API_COLLAB_REDIS_URL: redis://redis:6379/0
    MIY_API_REALTIME_REDIS_URL: redis://redis:6379/0
    MIY_API_TEST_RUN_ID: '$CI_JOB_ID'
    MIY_ENV_PROFILE: test
    MIY_MINIO_ACCESS_KEY: miy_ci_minio
    MIY_MINIO_BUCKET: miy-ci
    MIY_MINIO_ENDPOINT: http://minio:9000
    MIY_MINIO_SECRET_KEY: miy_ci_minio_job_only
    MIY_OPENSEARCH_INDEX_PREFIX: miy-ci
    MIY_OPENSEARCH_URL: http://opensearch:9200
    MIY_POSTGRES_DSN: '$MIY_CI_POSTGRES_DSN'
    MIY_TEST_MINIO_ACCESS_KEY: miy_ci_minio
    MIY_TEST_MINIO_ENDPOINT: http://minio:9000
    MIY_TEST_MINIO_SECRET_KEY: miy_ci_minio_job_only
    MIY_TEST_NON_PRODUCTION_ACK: non-production
    MIY_TEST_OPENSEARCH_URL: http://opensearch:9200
    MIY_TEST_POSTGRES_TEMPLATE_DSN: '$MIY_CI_POSTGRES_DSN'
    MIY_TEST_REDIS_URL: redis://redis:6379/0
    MIY_WORKER_BROKER_URL: memory://
    MIY_WORKER_QUEUE_GROUP: default
    MIY_WORKER_RESULT_BACKEND: cache+memory://
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
  before_script: []
  script:
    - bash scripts/ci/prepare-validation-runtime.sh --postgres
    - source scripts/ci/normalize-validation-postgres-dsn.sh
    - cp .env.example .env
    - sed -i 's#^MIY_ENV_PROFILE=.*#MIY_ENV_PROFILE=test#; s#^MIY_WORKER_BROKER_URL=.*#MIY_WORKER_BROKER_URL=memory://#; s#^MIY_WORKER_RESULT_BACKEND=.*#MIY_WORKER_RESULT_BACKEND=cache+memory://#' .env
    - grep -qx 'MIY_ENV_PROFILE=test' .env
    - grep -qx 'MIY_WORKER_BROKER_URL=memory://' .env
    - grep -qx 'MIY_WORKER_RESULT_BACKEND=cache+memory://' .env
    - printf 'release_validation source=%s target=%s base=%s\n' "$CI_COMMIT_SHA" "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" "$CI_MERGE_REQUEST_DIFF_BASE_SHA" > release-validation-context.md
    - node scripts/check-gitlab-pipeline.mjs
    - node scripts/check-mr-target-policy.mjs
    - git fetch --no-tags origin "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - node scripts/check-mr-contract-evidence.mjs
    - pnpm test:gitlab-pipeline
    - pnpm test:mr-target-policy
    - pnpm test:mr-contract-evidence
    - node scripts/release-validation.mjs ci
  after_script: []
  artifacts:
    when: always
    expire_in: 14 days
    access: maintainer
    paths:
      - release-validation-context.md
      - test-results/

codex_review:
  stage: review
  tags:
    - codex-local
  inherit:
    default: false
    variables: false
  dependencies: []
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      when: always
  variables:
    GIT_DEPTH: '0'
  before_script: []
  script:
    - /usr/local/bin/miy-codex-review-ci
  after_script: []
  artifacts:
    when: always
    expire_in: 14 days
    access: maintainer
    paths:
      - codex-review.md
      - codex-review-comment.md
      - codex-review-pipeline-context.md
      - codex-review-policy-context.md
      - codex-review-prior-context.md
      - codex-review-progress-start.md
      - codex-review-prompt.md
      - codex-review-run.log

contracts_publish:
  stage: publish
  image: miy-validation:node22-python312
  tags:
    - miy-validation
  inherit:
    default: false
    variables: false
  dependencies: []
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^contracts-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  before_script: []
  script:
    - bash scripts/ci/prepare-validation-runtime.sh
    - node scripts/check-gitlab-pipeline.mjs
    - node scripts/check-contracts-publish-tag.mjs
    - pnpm build:contracts
    - export NPM_CONFIG_USERCONFIG="$(mktemp)"
    - trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
    - printf '@miy:registry=%s/projects/%s/packages/npm/\n' "$CI_API_V4_URL" "$CI_PROJECT_ID" > "$NPM_CONFIG_USERCONFIG"
    - printf '//%s/projects/%s/packages/npm/:_authToken=%s\n' "${CI_API_V4_URL#*://}" "$CI_PROJECT_ID" "$CI_JOB_TOKEN" >> "$NPM_CONFIG_USERCONFIG"
    - cd packages/contracts
    - pnpm publish --no-git-checks
